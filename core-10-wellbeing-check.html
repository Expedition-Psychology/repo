<script>
// Size the frame to its content. Same origin, so the child document can be
// measured directly; the bundle renders asynchronously and the result panel
// changes height as answers come in, so keep watching rather than measuring once.
(function () {
  var f = document.getElementById('tool');
  if (!f) return;
  var last = 0;
  function fit() {
    try {
      var d = f.contentDocument;
      if (!d || !d.body) return;
      var h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
      if (h && Math.abs(h - last) > 2) { last = h; f.style.height = h + 'px'; }
    } catch (e) { /* cross-origin or not ready */ }
  }
  f.addEventListener('load', function () {
    fit();
    try {
      var d = f.contentDocument;
      if (window.ResizeObserver && d && d.body) new ResizeObserver(fit).observe(d.body);
      if (window.MutationObserver && d && d.body) {
        new MutationObserver(fit).observe(d.body, { childList: true, subtree: true });
      }
    } catch (e) {}
    // belt and braces while the bundle boots and fonts settle
    [200, 600, 1200, 2500, 5000].forEach(function (t) { setTimeout(fit, t); });
  });
  window.addEventListener('resize', fit);
})();
</script>

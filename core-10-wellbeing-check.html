<script>
// Size the frame to its content.
//
// This has to keep working on a slow phone. The first version attached
// observers at load and then ran five timed checks over five seconds; if the
// bundle was still booting past that, nothing measured again, the frame stayed
// at its minimum and — with scrolling switched off — most of the questionnaire
// became unreachable. A client hit exactly that on the CORE-10.
//
// So: the frame scrolls by default, and a cheap poll runs for the life of the
// page rather than giving up. Worst case now is an inner scrollbar, not lost
// questions.
(function () {
  var f = document.getElementById('tool');
  if (!f) return;
  function measure() {
    try {
      var d = f.contentDocument;
      if (!d || !d.body) return 0;
      return Math.max(d.body.scrollHeight, d.documentElement ? d.documentElement.scrollHeight : 0);
    } catch (e) { return 0; }   // not ready, or cross-origin
  }

  // Reconcile against the height actually rendered, not a remembered one:
  // a remembered value cannot tell that something else has resized the frame,
  // so the poll would sit there believing it had already done its job.
  function fit() {
    var h = measure();
    if (!h) return;
    var cur = Math.round(f.getBoundingClientRect().height);
    if (Math.abs(h - cur) > 2) f.style.height = h + 'px';
  }

  function watch() {
    try {
      var d = f.contentDocument;
      if (!d || !d.body) return;
      if (window.ResizeObserver) new ResizeObserver(fit).observe(d.body);
      if (window.MutationObserver) {
        new MutationObserver(fit).observe(d.body, { childList: true, subtree: true });
      }
    } catch (e) {}
  }

  f.addEventListener('load', function () { fit(); watch(); });
  window.addEventListener('resize', fit);
  setInterval(fit, 500);
  fit();
})();
</script>

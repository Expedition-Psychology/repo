document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rl(\"8cd04611-c738-4edd-997b-145cfedd5a28\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n\n/* cyrillic */\n\n/* vietnamese */\n\n/* latin-ext */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src:url(\"a3a56c6d-5d9e-4538-ace5-4e963c322805\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src:url(\"8cd04611-c738-4edd-997b-145cfedd5a28\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\/style>\n<style>/* ============================================================\n   Expedition Psychology \u2014 Colour tokens\n   Source: official Branding Guidelines\n   ============================================================ */\n\n:root {\n  /* ---- Brand: main palette ---------------------------------- */\n  --ep-plum:        #5b4a6a;   /* primary brand \u2014 Slate Plum   */\n  --ep-pine:        #4b7a6e;   /* secondary brand \u2014 Pine green */\n  --ep-paper:       #f3f3f0;   /* off-white surface            */\n  --ep-ink:         #2e2e2e;   /* near-black ink               */\n\n  /* ---- Brand: signal / diagram palette ---------------------- */\n  /* Used for assessment scales, data viz, status \u2014 low\u2192high.    */\n  --ep-clay:        #b6534b;   /* terracotta red  (alert / low) */\n  --ep-ember:       #c97a4a;   /* burnt orange    (caution)     */\n  --ep-sand:        #d6b86c;   /* muted gold      (moderate)    */\n  --ep-sage:        #6a977e;   /* soft sage       (steady/high) */\n\n  /* ---- Plum tints & shades (derived) ------------------------ */\n  --ep-plum-700:    #463a52;\n  --ep-plum-600:    #5b4a6a;\n  --ep-plum-400:    #82749140;  /* note: use tint tokens below for fills */\n  --ep-plum-tint:   #e7e3ec;   /* 12% plum on paper             */\n  --ep-plum-tint-2: #d2cbdb;\n\n  /* ---- Pine tints & shades (derived) ------------------------ */\n  --ep-pine-700:    #3a6056;\n  --ep-pine-600:    #4b7a6e;\n  --ep-pine-tint:   #dde9e5;   /* soft pine wash                */\n  --ep-pine-tint-2: #c3d6d0;\n\n  /* ---- Neutral scale (warm grey, off the ink/paper axis) ---- */\n  --ep-neutral-0:   #ffffff;\n  --ep-neutral-50:  #f7f7f4;\n  --ep-neutral-100: #f3f3f0;   /* = paper */\n  --ep-neutral-200: #e6e6e1;\n  --ep-neutral-300: #d4d4cd;\n  --ep-neutral-400: #aeaea6;\n  --ep-neutral-500: #84847c;\n  --ep-neutral-600: #5f5f59;\n  --ep-neutral-700: #444440;\n  --ep-neutral-800: #333330;\n  --ep-neutral-900: #2e2e2e;   /* = ink */\n\n  /* ---- Semantic aliases ------------------------------------- */\n  --surface-page:      var(--ep-paper);\n  --surface-raised:    var(--ep-neutral-0);\n  --surface-sunken:    var(--ep-neutral-50);\n  --surface-inverse:   var(--ep-ink);\n  --surface-brand:     var(--ep-plum);\n  --surface-brand-alt: var(--ep-pine);\n\n  --text-strong:    var(--ep-ink);\n  --text-body:      var(--ep-neutral-700);\n  --text-muted:     var(--ep-neutral-500);\n  --text-on-brand:  var(--ep-paper);\n  --text-on-dark:   var(--ep-paper);\n  --text-link:      var(--ep-pine-700);\n\n  --border-subtle:  var(--ep-neutral-200);\n  --border-default: var(--ep-neutral-300);\n  --border-strong:  var(--ep-neutral-400);\n  --border-brand:   var(--ep-plum);\n\n  --accent:         var(--ep-pine);\n  --accent-strong:  var(--ep-plum);\n\n  --status-danger:  var(--ep-clay);\n  --status-warning: var(--ep-ember);\n  --status-caution: var(--ep-sand);\n  --status-success: var(--ep-sage);\n\n  --focus-ring:     var(--ep-pine);\n}\n<\/style>\n<style>/* ============================================================\n   Expedition Psychology \u2014 Typography tokens\n   Headings: Arboria Medium  (substituted \u2192 Poppins)\n   Body:     Nunito Light\n   Brand heading:body size ratio guide \u2248 22 : 12\n   ============================================================ */\n\n:root {\n  /* ---- Families -------------------------------------------- */\n  --font-heading: 'arboria', 'Segoe UI', system-ui, sans-serif;\n  --font-body:    'Nunito', 'Segoe UI', system-ui, sans-serif;\n  --font-mono:    'Nunito', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* ---- Weights ---------------------------------------------- */\n  /* Body leans LIGHT per brand (Nunito Light = 300).            */\n  --weight-body:      300;\n  --weight-body-md:   400;\n  --weight-body-bold: 600;\n  /* Headings use Arboria Medium (the kit ships weight 500 only). */\n  --weight-heading:   500;\n  --weight-heading-md:500;\n\n  /* ---- Type scale (1.25 major-third-ish, tuned) ------------- */\n  --text-2xs:  0.75rem;   /* 12px \u2014 captions, legal           */\n  --text-xs:   0.8125rem; /* 13px                              */\n  --text-sm:   0.9375rem; /* 15px \u2014 small body                */\n  --text-base: 1.0625rem; /* 17px \u2014 default body              */\n  --text-lg:   1.25rem;   /* 20px \u2014 lead / large body         */\n  --text-xl:   1.5rem;    /* 24px \u2014 h4 / card title           */\n  --text-2xl:  1.9375rem; /* 31px \u2014 h3                        */\n  --text-3xl:  2.5rem;    /* 40px \u2014 h2                        */\n  --text-4xl:  3.25rem;   /* 52px \u2014 h1                        */\n  --text-5xl:  4.25rem;   /* 68px \u2014 display                   */\n  --text-6xl:  5.5rem;    /* 88px \u2014 hero display              */\n\n  /* ---- Line heights ---------------------------------------- */\n  --leading-tight:   1.08;\n  --leading-snug:    1.22;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* ---- Letter spacing -------------------------------------- */\n  --tracking-tight:  -0.02em;\n  --tracking-snug:   -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n  --tracking-caps:   0.14em;   /* eyebrows / overline labels   */\n\n  /* ---- Semantic roles -------------------------------------- */\n  --display-font:    var(--font-heading);\n  --display-weight:  var(--weight-heading);\n  --heading-font:    var(--font-heading);\n  --body-font:       var(--font-body);\n  --body-weight:     var(--weight-body);\n  --eyebrow-tracking:var(--tracking-caps);\n}\n<\/style>\n<style>/* ============================================================\n   Expedition Psychology \u2014 Spacing, radius, shadow, layout\n   8px base grid. Calm, generous, premium spacing.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (8px base) ----------------------------- */\n  --space-0:   0;\n  --space-1:   0.25rem;   /* 4  */\n  --space-2:   0.5rem;    /* 8  */\n  --space-3:   0.75rem;   /* 12 */\n  --space-4:   1rem;      /* 16 */\n  --space-5:   1.5rem;    /* 24 */\n  --space-6:   2rem;      /* 32 */\n  --space-7:   2.5rem;    /* 40 */\n  --space-8:   3rem;      /* 48 */\n  --space-9:   4rem;      /* 64 */\n  --space-10:  5rem;      /* 80 */\n  --space-11:  6.5rem;    /* 104 */\n  --space-12:  8rem;      /* 128 */\n\n  /* ---- Radius ---------------------------------------------- */\n  /* Understated, modern \u2014 gentle radii, never pill-soft on cards */\n  --radius-xs:   4px;\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-pill: 999px;\n\n  /* ---- Borders --------------------------------------------- */\n  --border-width:   1px;\n  --border-width-2: 2px;\n\n  /* ---- Shadows (soft, low, never harsh) -------------------- */\n  --shadow-xs:  0 1px 2px rgba(46, 46, 46, 0.06);\n  --shadow-sm:  0 1px 3px rgba(46, 46, 46, 0.08), 0 1px 2px rgba(46, 46, 46, 0.04);\n  --shadow-md:  0 4px 12px rgba(46, 46, 46, 0.08), 0 2px 4px rgba(46, 46, 46, 0.05);\n  --shadow-lg:  0 12px 32px rgba(46, 46, 46, 0.10), 0 4px 8px rgba(46, 46, 46, 0.05);\n  --shadow-xl:  0 24px 56px rgba(46, 46, 46, 0.14);\n  --shadow-focus: 0 0 0 3px rgba(75, 122, 110, 0.35);  /* pine focus */\n\n  /* ---- Motion ---------------------------------------------- */\n  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);  /* @kind other */\n  --ease-in-out:cubic-bezier(0.65, 0, 0.35, 1);  /* @kind other */\n  --dur-fast:   140ms;  /* @kind other */\n  --dur-base:   220ms;  /* @kind other */\n  --dur-slow:   400ms;  /* @kind other */\n\n  /* ---- Layout ---------------------------------------------- */\n  --container-sm:  640px;\n  --container-md:  860px;\n  --container-lg:  1120px;\n  --container-xl:  1320px;\n  --gutter:        var(--space-5);\n  --section-y:     var(--space-11);\n}\n<\/style>\n<style>/* ============================================================\n   Expedition Psychology \u2014 Base element defaults\n   Opinionated, minimal reset + brand typographic defaults.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-weight: var(--weight-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading);\n  font-weight: var(--weight-heading);\n  color: var(--text-strong);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  margin: 0 0 var(--space-4);\n  text-wrap: balance;\n}\n\nh1 { font-size: var(--text-4xl); }\nh2 { font-size: var 1;\n  --ep-neutral-300: #d4d4cd;\n  --ep-neutral-400: #aeaea6;\n  --ep-neutral-500: #84847c;\n  --ep-neutral-600: #5f5f59;\n  --ep-neutral-700: #444440;\n  --ep-neutral-800: #333330;\n  --ep-neutral-900: #2e2e2e;   /* = ink */\n\n  /* ---- Semantic aliases ------------------------------------- */\n  --surface-page:      var(--ep-paper);\n  --surface-raised:    var(--ep-neutral-0);\n  --surface-sunken:    var(--ep-neutral-50);\n  --surface-inverse:   var(--ep-ink);\n  --surface-brand:     var(--ep-plum);\n  --surface-brand-alt: var(--ep-pine);\n\n  --text-strong:    var(--ep-ink);\n  --text-body:      var(--ep-neutral-700);\n  --text-muted:     var(--ep-neutral-500);\n  --text-on-brand:  var(--ep-paper);\n  --text-on-dark:   var(--ep-paper);\n  --text-link:      var(--ep-pine-700);\n\n  --border-subtle:  var(--ep-neutral-200);\n  --border-default: var(--ep-neutral-300);\n  --border-strong:  var(--ep-neutral-400);\n  --border-brand:   var(--ep-plum);\n\n  --accent:         var(--ep-pine);\n  --accent-strong:  var(--ep-plum);\n\n  --status-danger:  var(--ep-clay);\n  --status-warning: var(--ep-ember);\n  --status-caution: var(--ep-sand);\n  --status-success: var(--ep-sage);\n\n  --focus-ring:     var(--ep-pine);\n}\n\n/* ============================================================\n   Expedition Psychology \u2014 Typography tokens\n   Headings: Arboria Medium  (substituted \u2192 Poppins)\n   Body:     Nunito Light\n   Brand heading:body size ratio guide \u2248 22 : 12\n   ============================================================ */\n\n:root {\n  /* ---- Families -------------------------------------------- */\n  --font-heading: 'arboria', 'Segoe UI', system-ui, sans-serif;\n  --font-body:    'Nunito', 'Segoe UI', system-ui, sans-serif;\n  --font-mono:    'Nunito', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* ---- Weights ---------------------------------------------- */\n  /* Body leans LIGHT per brand (Nunito Light = 300).            */\n  --weight-body:      300;\n  --weight-body-md:   400;\n  --weight-body-bold: 600;\n  /* Headings use Arboria Medium (the kit ships weight 500 only). */\n  --weight-heading:   500;\n  --weight-heading-md:500;\n\n  /* ---- Type scale (1.25 major-third-ish, tuned) ------------- */\n  --text-2xs:  0.75rem;   /* 12px \u2014 captions, legal           */\n  --text-xs:   0.8125rem; /* 13px                              */\n  --text-sm:   0.9375rem; /* 15px \u2014 small body                */\n  --text-base: 1.0625rem; /* 17px \u2014 default body              */\n  --text-lg:   1.25rem;   /* 20px \u2014 lead / large body         */\n  --text-xl:   1.5rem;    /* 24px \u2014 h4 / card title           */\n  --text-2xl:  1.9375rem; /* 31px \u2014 h3                        */\n  --text-3xl:  2.5rem;    /* 40px \u2014 h2                        */\n  --text-4xl:  3.25rem;   /* 52px \u2014 h1                        */\n  --text-5xl:  4.25rem;   /* 68px \u2014 display                   */\n  --text-6xl:  5.5rem;    /* 88px \u2014 hero display              */\n\n  /* ---- Line heights ---------------------------------------- */\n  --leading-tight:   1.08;\n  --leading-snug:    1.22;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* ---- Letter spacing -------------------------------------- */\n  --tracking-tight:  -0.02em;\n  --tracking-snug:   -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n  --tracking-caps:   0.14em;   /* eyebrows / overline labels   */\n\n  /* ---- Semantic roles -------------------------------------- */\n  --display-font:    var(--font-heading);\n  --display-weight:  var(--weight-heading);\n  --heading-font:    var(--font-heading);\n  --body-font:       var(--font-body);\n  --body-weight:     var(--weight-body);\n  --eyebrow-tracking:var(--tracking-caps);\n}\n\n/* ============================================================\n   Expedition Psychology \u2014 Spacing, radius, shadow, layout\n   8px base grid. Calm, generous, premium spacing.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (8px base) ----------------------------- */\n  --space-0:   0;\n  --space-1:   0.25rem;   /* 4  */\n  --space-2:   0.5rem;    /* 8  */\n  --space-3:   0.75rem;   /* 12 */\n  --space-4:   1rem;      /* 16 */\n  --space-5:   1.5rem;    /* 24 */\n  --space-6:   2rem;      /* 32 */\n  --space-7:   2.5rem;    /* 40 */\n  --space-8:   3rem;      /* 48 */\n  --space-9:   4rem;      /* 64 */\n  --space-10:  5rem;      /* 80 */\n  --space-11:  6.5rem;    /* 104 */\n  --space-12:  8rem;      /* 128 */\n\n  /* ---- Radius ---------------------------------------------- */\n  /* Understated, modern \u2014 gentle radii, never pill-soft on cards */\n  --radius-xs:   4px;\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-pill: 999px;\n\n  /* ---- Borders --------------------------------------------- */\n  --border-width:   1px;\n  --border-width-2: 2px;\n\n  /* ---- Shadows (soft, low, never harsh) -------------------- */\n  --shadow-xs:  0 1px 2px rgba(46, 46, 46, 0.06);\n  --shadow-sm:  0 1px 3px rgba(46, 46, 46, 0.08), 0 1px 2px rgba(46, 46, 46, 0.04);\n  --shadow-md:  0 4px 12px rgba(46, 46, 46, 0.08), 0 2px 4px rgba(46, 46, 46, 0.05);\n  --shadow-lg:  0 12px 32px rgba(46, 46, 46, 0.10), 0 4px 8px rgba(46, 46, 46, 0.05);\n  --shadow-xl:  0 24px 56px rgba(46, 46, 46, 0.14);\n  --shadow-focus: 0 0 0 3px rgba(75, 122, 110, 0.35);  /* pine focus */\n\n  /* ---- Motion ---------------------------------------------- */\n  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);  /* @kind other */\n  --ease-in-out:cubic-bezier(0.65, 0, 0.35, 1);  /* @kind other */\n  --dur-fast:   140ms;  /* @kind other */\n  --dur-base:   220ms;  /* @kind other */\n  --dur-slow:   400ms;  /* @kind other */\n\n  /* ---- Layout ---------------------------------------------- */\n  --container-sm:  640px;\n  --container-md:  860px;\n  --container-lg:  1120px;\n  --container-xl:  1320px;\n  --gutter:        var(--space-5);\n  --section-y:     var(--space-11);\n}\n\n/* ============================================================\n   Expedition Psychology \u2014 Base element defaults\n   Opinionated, minimal reset + brand typographic defaults.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-weight: var(--weight-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading);\n  font-weight: var(--weight-heading);\n  color: var(--text-strong);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  margin: 0 0 var(--space-4);\n  text-wrap: balance;\n}\n\nh1 { font-size: var(--text-4xl); }\nh2 { font-size: var(--text-3xl); }\nh3 { font-size: var(--text-2xl); letter-spacing: var(--tracking-snug); }\nh4 { font-size: var(--text-xl); letter-spacing: var(--tracking-snug); }\nh5 { font-size: var(--text-lg); letter-spacing: var(--tracking-normal); }\nh6 {\n  font-size: var(--text-2xs);\n  font-weight: var(--weight-heading);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--text-muted);\n  line-height: var(--leading-snug);\n}\n\np { margin: 0 0 var(--space-4); text-wrap: pretty; }\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; text-underline-offset: 2px; }\n\nstrong, b { font-weight: var(--weight-body-bold); color: var(--text-strong); }\n\nsmall { font-size: var(--text-2xs); }\n\nhr {\n  border: 0;\n  border-top: var(--border-width) solid var(--border-subtle);\n  margin: var(--space-6) 0;\n}\n\n::selection { background: var(--ep-pine-tint-2); color: var(--text-strong); }\n\n/* Eyebrow / overline label utility */\n.ep-eyebrow {\n  font-family: var(--font-heading);\n  font-weight: var(--weight-heading-md);\n  font-size: var(--text-2xs);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--accent);\n}\n\n<\/style>\n<script src=\"358f0ba0-1c46-4e5b-ae3e-91efd6d7a52e\"><\/script>\n<style>\n  html, body { margin:0; padding:0; background:var(--ep-paper); }\n  a { color:var(--text-link); }\n  a:hover { color:var(--ep-plum); }\n  @page { margin:14mm; }\n  @media print {\n    .noprint { display:none !important; }\n    html, body { background:#fff; }\n  }\n<\/style>\n<\/helmet>\n<div style=\"background:var(--ep-paper); color:var(--text-body); font-family:var(--font-body); font-weight:300; min-height:100vh; padding:clamp(24px,5vw,64px) clamp(18px,5vw,32px) 72px;\">\n  <div style=\"max-width:820px; margin:0 auto;\">\n\n    <header data-screen-label=\"Header\" style=\"display:grid; gap:14px;\">\n      <div style=\"font-family:var(--font-heading); font-weight:500; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ep-pine);\">Expedition Psychology \u00b7 Self-assessment<\/div>\n      <h1 style=\"font-family:var(--font-heading); font-weight:500; color:var(--ep-plum); font-size:clamp(30px,5.4vw,46px); line-height:1.08; margin:0; max-width:24ch;\">Self-criticism and self-reassurance (FSCRS)<\/h1>\n      <p style=\"margin:0; max-width:62ch; font-size:clamp(16px,2.2vw,18px); line-height:1.6; color:var(--ep-neutral-700); text-wrap:pretty;\">Twenty-two statements about how you treat yourself when things go wrong. It takes about four minutes. Rather than one total, you get three scores: how much you feel inadequate, how much you turn against yourself, and how well you can reassure yourself.<\/p>\n      <hr style=\"border:0; border-top:1px solid var(--ep-neutral-300); margin:8px 0 0;\">\n    <\/header>\n\n    <section data-screen-label=\"Instructions\" style=\"margin-top:28px; background:var(--ep-plum-tint); border:1px solid var(--ep-plum-tint-2); border-radius:var(--radius-lg); padding:clamp(18px,3vw,26px);\">\n      <p style=\"margin:0; font-family:var(--font-heading); font-weight:500; color:var(--ep-plum-700); font-size:clamp(17px,2.6vw,21px); line-height:1.45; text-wrap:pretty;\">When things go wrong for me\u2026 how much is each statement like you?<\/p>\n      <p style=\"margin:10px 0 0; font-size:15px; color:var(--ep-neutral-600); max-width:64ch;\">When life does not go as hoped, we can be hard on ourselves \u2014 and we can also be supportive. There are no right answers; choose what is true for you. Your answers stay on this device.<\/p>\n    <\/section>\n\n    <section data-screen-label=\"Items\" style=\"margin-top:22px; display:grid; gap:14px;\">\n      <sc-for list=\"{{ items }}\" as=\"item\" hint-placeholder-count=\"22\">\n        <div style=\"background:var(--surface-raised); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:clamp(16px,2.6vw,22px);\">\n          <div style=\"display:flex; gap:12px; align-items:flex-start;\">\n            <span style=\"font-family:var(--font-heading); font-weight:500; font-size:14px; color:var(--ep-neutral-400); min-width:22px; padding-top:2px;\">{{ item.n }}<\/span>\n            <p style=\"margin:0; font-size:clamp(15px,2.1vw,17px); line-height:1.5; color:var(--text-strong); text-wrap:pretty;\">{{ item.text }}<\/p>\n          <\/div>\n          <div style=\"margin-top:14px; display:grid; grid-template-columns:repeat(auto-fit,minmax(122px,1fr)); gap:8px;\">\n            <sc-for list=\"{{ item.opts }}\" as=\"opt\" hint-placeholder-count=\"5\">\n              <button type=\"button\" sc-camel-on-click=\"{{ opt.onClick }}\" aria-pressed=\"{{ opt.pressed }}\" style=\"{{ opt.style }}\" style-hover=\"border-color:var(--ep-pine)\" style-focus=\"outline:2px solid var(--ep-pine); outline-offset:2px\">\n                <span>{{ opt.label }}<\/span>\n                <sc-if value=\"{{ opt.showValue }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"font-family:var(--font-heading); font-size:12px; opacity:.6;\">{{ opt.value }}<\/span>\n                <\/sc-if>\n              <\/button>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n      <\/sc-for>\n    <\/section>\n\n    <section data-screen-label=\"Result\" style=\"margin-top:26px;\">\n      <sc-if value=\"{{ incomplete }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border:1px dashed var(--border-default); border-radius:var(--radius-lg); padding:clamp(20px,3vw,28px); text-align:center;\">\n          <p style=\"margin:0; font-family:var(--font-heading); font-weight:500; color:var(--ep-plum); font-size:18px;\">{{ answeredLabel }}<\/p>\n          <p style=\"margin:8px 0 0; font-size:15px; color:var(--ep-neutral-600);\">Your three subscale scores appear here once every statement has an answer.<\/p>\n          <div style=\"margin-top:16px; height:6px; border-radius:999px; background:var(--ep-neutral-200); overflow:hidden;\">\n            <div style=\"{{ progressStyle }}\"><\/div>\n          <\/div>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ complete }}\">\n        <div style=\"background:var(--surface-raised); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); box-shadow:var(--shadow-md); overflow:hidden;\">\n          <div style=\"padding:clamp(20px,3.4vw,30px); background:var(--ep-plum); color:var(--ep-paper);\">\n            <div style=\"font-family:var(--font-heading); font-weight:500; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; opacity:.75;\">Your profile<\/div>\n            <div style=\"font-family:var(--font-heading); font-weight:500; font-size:clamp(22px,4vw,30px); line-height:1.2; margin-top:6px; max-width:30ch;\">{{ headline }}<\/div>\n          <\/div>\n\n          <div style=\"padding:clamp(18px,3vw,28px); display:grid; gap:14px;\">\n            <sc-for list=\"{{ subscales }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"background:var(--surface-sunken); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:clamp(14px,2.4vw,20px);\">\n                <div style=\"display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 16px;\">\n                  <div>\n                    <div style=\"font-family:var(--font-heading); font-weight:500; font-size:18px; color:var(--text-strong);\">{{ s.name }}<\/div>\n                    <div style=\"font-size:13px; color:var(--ep-neutral-600); margin-top:2px;\">{{ s.sub }}<\/div>\n                  <\/div>\n                  <div style=\"display:flex; align-items:baseline; gap:10px;\">\n                    <span style=\"font-family:var(--font-heading); font-weight:500; font-size:28px; color:var(--ep-plum);\">{{ s.score }}<\/span>\n                    <span style=\"{{ s.levelStyle }}\">{{ s.level }}<\/span>\n                  <\/div>\n                <\/div>\n                <div style=\"margin-top:12px; height:8px; border-radius:999px; background:var(--ep-neutral-200); overflow:hidden;\">\n                  <div style=\"{{ s.barStyle }}\"><\/div>\n                <\/div>\n                <p style=\"margin:12px 0 0; font-size:15px; line-height:1.6; color:var(--ep-neutral-700); text-wrap:pretty;\">{{ s.note }}<\/p>\n              <\/div>\n            <\/sc-for>\n\n            <p style=\"margin:6px 0 0; font-size:16px; line-height:1.6; color:var(--text-strong); text-wrap:pretty;\">{{ guidance }}<\/p>\n\n            <sc-if value=\"{{ riskFlag }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:var(--ep-ink); color:var(--ep-paper); border-radius:var(--radius-md); padding:16px 18px;\">\n                <div style=\"font-family:var(--font-heading); font-weight:500; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ep-sand);\">Please read this<\/div>\n                <p style=\"margin:8px 0 0; font-size:16px; line-height:1.6; text-wrap:pretty;\">You said that at times you have become so angry with yourself that you want to hurt or injure yourself. Please do not carry that alone. Talk to your GP or a therapist, and if you feel at risk right now, call the Samaritans free on <strong style=\"font-weight:600; color:var(--ep-paper);\">116 123<\/strong> (24 hours) or dial <strong style=\"font-weight:600; color:var(--ep-paper);\">999<\/strong>.<\/p>\n              <\/div>\n            <\/sc-if>\n\n            <div class=\"noprint\" style=\"margin-top:8px; display:flex; flex-wrap:wrap; gap:10px;\">\n              <x-import component-from-global-scope=\"ExpeditionPsychologyDesignSystem_4e7d0e.Button\" variant=\"primary\" size=\"md\" sc-camel-on-click=\"{{ onPrint }}\" hint-size=\"auto,44px\">Save or print result<\/x-import>\n              <x-import component-from-global-scope=\"ExpeditionPsychologyDesignSystem_4e7d0e.Button\" variant=\"secondary\" size=\"md\" sc-camel-on-click=\"{{ onReset }}\" hint-size=\"auto,44px\">Start again<\/x-import>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/sc-if>\n    <\/section>\n\n    <footer data-screen-label=\"Footer\" style=\"margin-top:30px; border-top:1px solid var(--ep-neutral-300); padding-top:18px; display:grid; gap:10px;\">\n      <p style=\"margin:0; font-size:14px; line-height:1.6; color:var(--ep-neutral-600);\">This scale has no official clinical cut-offs. It describes how you relate to yourself under pressure rather than diagnosing anything. Levels shown here are based on your average answer within each subscale, using the scale\u2019s own wording. Harsh self-criticism is very workable \u2014 approaches such as compassion-focused therapy target it directly.<\/p>\n      <p style=\"margin:0; font-size:13px; line-height:1.6; color:var(--ep-neutral-500);\">FSCRS \u00a9 Gilbert et al., 2004. Gilbert, P., Clarke, M., Hempel, S., Miles, J.N.V. &amp; Irons, C. (2004). Criticising and reassuring oneself: An exploration of forms, styles and reasons in female students. British Journal of Clinical Psychology, 43, 31\u201350.<\/p>\n    <\/footer>\n\n  <\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showItemValues&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  ITEMS = [\n    ['I am easily disappointed with myself.', 'is'],\n    ['There is a part of me that puts me down.', 'is'],\n    ['I am able to remind myself of positive things about myself.', 'rs'],\n    ['I find it difficult to control my anger and frustration at myself.', 'is'],\n    ['I find it easy to forgive myself.', 'rs'],\n    ['There is a part of me that feels I am not good enough.', 'is'],\n    ['I feel beaten down by my own self-critical thoughts.', 'is'],\n    ['I still like being me.', 'rs'],\n    ['I have become so angry with myself that I want to hurt or injure myself.', 'hs'],\n    ['I have a sense of disgust with myself.', 'hs'],\n    ['I can still feel lovable and acceptable.', 'rs'],\n    ['I stop caring about myself.', 'hs'],\n    ['I find it easy to like myself.', 'rs'],\n    ['I remember and dwell on my failings.', 'is'],\n    ['I call myself names.', 'hs'],\n    ['I am gentle and supportive with myself.', 'rs'],\n    ['I can\\u2019t accept failures and setbacks without feeling inadequate.', 'is'],\n    ['I think I deserve my self-criticism.', 'is'],\n    ['I am able to care and look after myself.', 'rs'],\n    ['There is a part of me that wants to get rid of the bits I don\\u2019t like.', 'is'],\n    ['I encourage myself for the future.', 'rs'],\n    ['I do not like being me.', 'hs']\n  ];\n  OPTS = ['Not at all like me', 'A little bit like me', 'Moderately like me', 'Quite a bit like me', 'Extremely like me'];\n  LEVELS = ['Low', 'Mild', 'Moderate', 'High', 'Very high'];\n  SUBS = {\n    is: { name: 'Inadequate self', sub: 'A sense of personal inadequacy and falling short', good: false,\n      notes: [\n        'Setbacks do not seem to leave you feeling inadequate very often.',\n        'Some sense of falling short when things go wrong \\u2014 common, and usually manageable.',\n        'A noticeable pull towards feeling not good enough when things go wrong.',\n        'Feeling inadequate is a strong, frequent response to setbacks for you.',\n        'Feeling inadequate seems to dominate how you respond when things go wrong.'\n      ] },\n    hs: { name: 'Hated self', sub: 'Turning against yourself with dislike, disgust, or a wish to hurt', good: false,\n      notes: [\n        'Little sign of turning against yourself in a hostile way.',\n        'Some hostility towards yourself shows up at times. It is worth noticing when it happens.',\n        'Hostility towards yourself is a real part of how you respond to setbacks. This form of self-criticism is the one most closely linked with low mood, so it is worth talking about.',\n        'Strong feelings of dislike or disgust towards yourself. This is a significant load and it is worth getting support with it.',\n        'Very strong hostility towards yourself. Please talk to a professional about this \\u2014 it is treatable, and you should not have to manage it alone.'\n      ] },\n    rs: { name: 'Reassured self', sub: 'Being able to support, encourage, and be kind to yourself', good: true,\n      notes: [\n        'Reassuring yourself does not come easily right now. It is a skill, and it can be built.',\n        'Some ability to reassure yourself, though it may be hard to reach when things go wrong.',\n        'A moderate capacity to support yourself through setbacks.',\n        'A good capacity to be kind to yourself and encourage yourself when things go wrong.',\n        'A strong ability to reassure and look after yourself \\u2014 a real resource under pressure.'\n      ] }\n  };\n  KEY = 'ep-fscrs-v1';\n  state = { answers: new Array(22).fill(null) };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(this.KEY);\n      if (raw) {\n        const s = JSON.parse(raw);\n        if (Array.isArray(s.answers) && s.answers.length === 22) this.setState({ answers: s.answers });\n      }\n    } catch (e) {}\n  }\n  save(next) { try { localStorage.setItem(this.KEY, JSON.stringify(next)); } catch (e) {} }\n  pick(i, v) {\n    this.setState(s => {\n      const answers = s.answers.slice();\n      answers[i] = answers[i] === v ? null : v;\n      const next = { answers };\n      this.save(next);\n      return next;\n    });\n  }\n  optStyle(sel) {\n    const base = 'display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:52px; padding:10px 13px; border-radius:var(--radius-md); font-family:var(--font-body); font-weight:300; font-size:14px; line-height:1.3; text-align:left; cursor:pointer; transition:background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);';\n    return base + (sel\n      ? ' background:var(--ep-pine); border:1px solid var(--ep-pine); color:var(--ep-paper); font-weight:400;'\n      : ' background:var(--surface-raised); border:1px solid var(--border-default); color:var(--ep-neutral-700);');\n  }\n  levelIndex(mean) { return Math.min(4, Math.floor(mean + 0.5)); }\n  levelColor(idx, good) {\n    const bad = ['var(--ep-sage)', 'var(--ep-sand)', 'var(--ep-ember)', 'var(--ep-clay)', 'var(--ep-clay)'];\n    return good ? bad[4 - idx] : bad[idx];\n  }\n\n  renderVals() {\n    const showValue = this.props.showItemValues ?? true;\n    const answers = this.state.answers;\n    const answered = answers.filter(a => a !== null).length;\n    const complete = answered === 22;\n\n    const calc = {};\n    ['is', 'hs', 'rs'].forEach(k => {\n      const idx = this.ITEMS.map((it, i) => it[1] === k ? i : -1).filter(i => i >= 0);\n      const sum = idx.reduce((t, i) => t + (answers[i] || 0), 0);\n      const max = idx.length * 4;\n      const mean = sum / idx.length;\n      calc[k] = { sum, max, mean, lvl: this.levelIndex(mean) };\n    });\n\n    const subscales = ['is', 'hs', 'rs'].map(k => {\n      const d = this.SUBS[k], c = calc[k];\n      const color = this.levelColor(c.lvl, d.good);\n      return {\n        name: d.name, sub: d.sub,\n        score: c.sum + ' / ' + c.max,\n        level: this.LEVELS[c.lvl],\n        levelStyle: 'font-family:var(--font-heading); font-weight:500; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; padding:4px 10px; border-radius:999px; color:#fff; background:' + color + ';',\n        barStyle: 'height:100%; width:' + Math.round((c.sum / c.max) * 100) + '%; background:' + color + '; transition:width var(--dur-base) var(--ease-out);',\n        note: d.notes[c.lvl]\n      };\n    });\n\n    const crit = Math.max(calc.is.mean, calc.hs.mean);\n    const reas = calc.rs.mean;\n    let headline, guidance;\n    if (crit < 1.5 && reas >= 2) {\n      headline = 'Mostly supportive towards yourself when things go wrong';\n      guidance = 'Your self-reassurance outweighs your self-criticism. That balance is protective under pressure \\u2014 worth knowing, and worth keeping.';\n    } else if (crit >= 2.5 && reas < 1.5) {\n      headline = 'Hard on yourself, with little to soften it';\n      guidance = 'High self-criticism alongside low self-reassurance is the pattern most linked to low mood and anxiety. It is very workable: compassion-focused therapy and CBT both target it directly. It is worth raising with your GP or a qualified therapist.';\n    } else if (crit > reas) {\n      headline = 'Self-criticism tends to outweigh self-reassurance';\n      guidance = 'The critical voice is currently louder than the supportive one. Practising a kinder, more coaching tone with yourself after setbacks \\u2014 the way you would speak to a teammate \\u2014 can shift this balance. A therapist can help if it feels stuck.';\n    } else {\n      headline = 'A mix of self-criticism and self-reassurance';\n      guidance = 'You have both a critical and a supportive response to setbacks. Noticing which one shows up first, and deliberately bringing in the supportive one, is a practical place to start.';\n    }\n\n    return {\n      items: this.ITEMS.map((it, i) => ({\n        n: String(i + 1).padStart(2, '0'),\n        text: it[0],\n        opts: this.OPTS.map((label, v) => ({\n          label, value: v, showValue,\n          pressed: answers[i] === v,\n          style: this.optStyle(answers[i] === v),\n          onClick: () => this.pick(i, v)\n        }))\n      })),\n      incomplete: !complete,\n      complete,\n      answeredLabel: answered + ' of 22 answered',\n      progressStyle: 'height:100%; width:' + Math.round((answered / 22) * 100) + '%; background:var(--ep-pine); transition:width var(--dur-base) var(--ease-out);',\n      subscales,\n      headline,\n      guidance,\n      riskFlag: answers[8] !== null && answers[8] > 0,\n      onPrint: () => window.print(),\n      onReset: () => {\n        const next = { answers: new Array(22).fill(null) };\n        this.save(next);\n        this.setState(next);\n        window.scrollTo({ top: 0, behavior: 'smooth' });\n      }\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fc85b4ea-b6fd-4c67-9764-d47f049ace3d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ============================================================\n   Expedition Psychology — Colour tokens\n   Source: official Branding Guidelines\n   ============================================================ */\n\n:root {\n  /* ---- Brand: main palette ---------------------------------- */\n  --ep-plum:        #5b4a6a;   /* primary brand — Slate Plum   */\n  --ep-pine:        #4b7a6e;   /* secondary brand — Pine green */\n  --ep-paper:       #f3f3f0;   /* off-white surface            */\n  --ep-ink:         #2e2e2e;   /* near-black ink               */\n\n  /* ---- Brand: signal / diagram palette ---------------------- */\n  /* Used for assessment scales, data viz, status — low→high.    */\n  --ep-clay:        #b6534b;   /* terracotta red  (alert / low) */\n  --ep-ember:       #c97a4a;   /* burnt orange    (caution)     */\n  --ep-sand:        #d6b86c;   /* muted gold      (moderate)    */\n  --ep-sage:        #6a977e;   /* soft sage       (steady/high) */\n\n  /* ---- Plum tints & shades (derived) ------------------------ */\n  --ep-plum-700:    #463a52;\n  --ep-plum-600:    #5b4a6a;\n  --ep-plum-400:    #82749140;  /* note: use tint tokens below for fills */\n  --ep-plum-tint:   #e7e3ec;   /* 12% plum on paper             */\n  --ep-plum-tint-2: #d2cbdb;\n\n  /* ---- Pine tints & shades (derived) ------------------------ */\n  --ep-pine-700:    #3a6056;\n  --ep-pine-600:    #4b7a6e;\n  --ep-pine-tint:   #dde9e5;   /* soft pine wash                */\n  --ep-pine-tint-2: #c3d6d0;\n\n  /* ---- Neutral scale (warm grey, off the ink/paper axis) ---- */\n  --ep-neutral-0:   #ffffff;\n  --ep-neutral-50:  #f7f7f4;\n  --ep-neutral-100: #f3f3f0;   /* = paper */\n  --ep-neutral-200: #e6e6e1;\n  --ep-neutral-300: #d4d4cd;\n  --ep-neutral-400: #aeaea6;\n  --ep-neutral-500: #84847c;\n  --ep-neutral-600: #5f5f59;\n  --ep-neutral-700: #444440;\n  --ep-neutral-800: #333330;\n  --ep-neutral-900: #2e2e2e;   /* = ink */\n\n  /* ---- Semantic aliases ------------------------------------- */\n  --surface-page:      var(--ep-paper);\n  --surface-raised:    var(--ep-neutral-0);\n  --surface-sunken:    var(--ep-neutral-50);\n  --surface-inverse:   var(--ep-ink);\n  --surface-brand:     var(--ep-plum);\n  --surface-brand-alt: var(--ep-pine);\n\n  --text-strong:    var(--ep-ink);\n  --text-body:      var(--ep-neutral-700);\n  --text-muted:     var(--ep-neutral-500);\n  --text-on-brand:  var(--ep-paper);\n  --text-on-dark:   var(--ep-paper);\n  --text-link:      var(--ep-pine-700);\n\n  --border-subtle:  var(--ep-neutral-200);\n  --border-default: var(--ep-neutral-300);\n  --border-strong:  var(--ep-neutral-400);\n  --border-brand:   var(--ep-plum);\n\n  --accent:         var(--ep-pine);\n  --accent-strong:  var(--ep-plum);\n\n  --status-danger:  var(--ep-clay);\n  --status-warning: var(--ep-ember);\n  --status-caution: var(--ep-sand);\n  --status-success: var(--ep-sage);\n\n  --focus-ring:     var(--ep-pine);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Expedition Psychology — Typography tokens\n   Headings: Arboria Medium  (substituted → Poppins)\n   Body:     Nunito Light\n   Brand heading:body size ratio guide ≈ 22 : 12\n   ============================================================ */\n\n:root {\n  /* ---- Families -------------------------------------------- */\n  --font-heading: 'arboria', 'Segoe UI', system-ui, sans-serif;\n  --font-body:    'Nunito', 'Segoe UI', system-ui, sans-serif;\n  --font-mono:    'Nunito', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* ---- Weights ---------------------------------------------- */\n  /* Body leans LIGHT per brand (Nunito Light = 300).            */\n  --weight-body:      300;\n  --weight-body-md:   400;\n  --weight-body-bold: 600;\n  /* Headings use Arboria Medium (the kit ships weight 500 only). */\n  --weight-heading:   500;\n  --weight-heading-md:500;\n\n  /* ---- Type scale (1.25 major-third-ish, tuned) ------------- */\n  --text-2xs:  0.75rem;   /* 12px — captions, legal           */\n  --text-xs:   0.8125rem; /* 13px                              */\n  --text-sm:   0.9375rem; /* 15px — small body                */\n  --text-base: 1.0625rem; /* 17px — default body              */\n  --text-lg:   1.25rem;   /* 20px — lead / large body         */\n  --text-xl:   1.5rem;    /* 24px — h4 / card title           */\n  --text-2xl:  1.9375rem; /* 31px — h3                        */\n  --text-3xl:  2.5rem;    /* 40px — h2                        */\n  --text-4xl:  3.25rem;   /* 52px — h1                        */\n  --text-5xl:  4.25rem;   /* 68px — display                   */\n  --text-6xl:  5.5rem;    /* 88px — hero display              */\n\n  /* ---- Line heights ---------------------------------------- */\n  --leading-tight:   1.08;\n  --leading-snug:    1.22;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* ---- Letter spacing -------------------------------------- */\n  --tracking-tight:  -0.02em;\n  --tracking-snug:   -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n  --tracking-caps:   0.14em;   /* eyebrows / overline labels   */\n\n  /* ---- Semantic roles -------------------------------------- */\n  --display-font:    var(--font-heading);\n  --display-weight:  var(--weight-heading);\n  --heading-font:    var(--font-heading);\n  --body-font:       var(--font-body);\n  --body-weight:     var(--weight-body);\n  --eyebrow-tracking:var(--tracking-caps);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Expedition Psychology — Spacing, radius, shadow, layout\n   8px base grid. Calm, generous, premium spacing.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (8px base) ----------------------------- */\n  --space-0:   0;\n  --space-1:   0.25rem;   /* 4  */\n  --space-2:   0.5rem;    /* 8  */\n  --space-3:   0.75rem;   /* 12 */\n  --space-4:   1rem;      /* 16 */\n  --space-5:   1.5rem;    /* 24 */\n  --space-6:   2rem;      /* 32 */\n  --space-7:   2.5rem;    /* 40 */\n  --space-8:   3rem;      /* 48 */\n  --space-9:   4rem;      /* 64 */\n  --space-10:  5rem;      /* 80 */\n  --space-11:  6.5rem;    /* 104 */\n  --space-12:  8rem;      /* 128 */\n\n  /* ---- Radius ---------------------------------------------- */\n  /* Understated, modern — gentle radii, never pill-soft on cards */\n  --radius-xs:   4px;\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-pill: 999px;\n\n  /* ---- Borders --------------------------------------------- */\n  --border-width:   1px;\n  --border-width-2: 2px;\n\n  /* ---- Shadows (soft, low, never harsh) -------------------- */\n  --shadow-xs:  0 1px 2px rgba(46, 46, 46, 0.06);\n  --shadow-sm:  0 1px 3px rgba(46, 46, 46, 0.08), 0 1px 2px rgba(46, 46, 46, 0.04);\n  --shadow-md:  0 4px 12px rgba(46, 46, 46, 0.08), 0 2px 4px rgba(46, 46, 46, 0.05);\n  --shadow-lg:  0 12px 32px rgba(46, 46, 46, 0.10), 0 4px 8px rgba(46, 46, 46, 0.05);\n  --shadow-xl:  0 24px 56px rgba(46, 46, 46, 0.14);\n  --shadow-focus: 0 0 0 3px rgba(75, 122, 110, 0.35);  /* pine focus */\n\n  /* ---- Motion ---------------------------------------------- */\n  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);  /* @kind other */\n  --ease-in-out:cubic-bezier(0.65, 0, 0.35, 1);  /* @kind other */\n  --dur-fast:   140ms;  /* @kind other */\n  --dur-base:   220ms;  /* @kind other */\n  --dur-slow:   400ms;  /* @kind other */\n\n  /* ---- Layout ---------------------------------------------- */\n  --container-sm:  640px;\n  --container-md:  860px;\n  --container-lg:  1120px;\n  --container-xl:  1320px;\n  --gutter:        var(--space-5);\n  --section-y:     var(--space-11);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Expedition Psychology — Base element defaults\n   Opinionated, minimal reset + brand typographic defaults.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-weight: var(--weight-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading);\n  font-weight: var(--weight-heading);\n  color: var(--text-strong);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  margin: 0 0 var(--space-4);\n  text-wrap: balance;\n}\n\nh1 { font-size: var(--text-4xl); }\nh2 { font-size: var(--text-3xl); }\nh3 { font-size: var(--text-2xl); letter-spacing: var(--tracking-snug); }\nh4 { font-size: var(--text-xl); letter-spacing: var(--tracking-snug); }\nh5 { font-size: var(--text-lg); letter-spacing: var(--tracking-normal); }\nh6 {\n  font-size: var(--text-2xs);\n  font-weight: var(--weight-heading);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--text-muted);\n  line-height: var(--leading-snug);\n}\n\np { margin: 0 0 var(--space-4); text-wrap: pretty; }\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; text-underline-offset: 2px; }\n\nstrong, b { font-weight: var(--weight-body-bold); color: var(--text-strong); }\n\nsmall { font-size: var(--text-2xs); }\n\nhr {\n  border: 0;\n  border-top: var(--border-width) solid var(--border-subtle);\n  margin: var(--space-6) 0;\n}\n\n::selection { background: var(--ep-pine-tint-2); color: var(--text-strong); }\n\n/* Eyebrow / overline label utility */\n.ep-eyebrow {\n  font-family: var(--font-heading);\n  font-weight: var(--weight-heading-md);\n  font-size: var(--text-2xs);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--accent);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Expedition Psychology — Design System\n   Global stylesheet entry point.\n   Consumers link THIS one file. Keep it @import-only.\n   ============================================================ */\n\n/* ============================================================\n   Expedition Psychology — Webfonts\n   ------------------------------------------------------------\n   Brand fonts:\n     • Headings / titles / single words  → Arboria Medium\n     • Body / detailed content / bullets  → Nunito Light\n\n   Arboria is served live from the brand's Adobe Fonts (Typekit)\n   kit. The family name exposed by the kit is `arboria`.\n   Nunito is served from Google Fonts and matches the spec exactly.\n   ============================================================ */\n\n/*\n * The Typekit service used to deliver this font or fonts for use on websites\n * is provided by Adobe and is subject to these Terms of Use\n * http://www.adobe.com/products/eulas/tou_typekit. For font license\n * information, see the list below.\n *\n * arboria:\n *   - http://typekit.com/eulas/0000000000000000775b8121\n * nunito:\n *   - http://typekit.com/eulas/00000000000000007753c3b5\n *\n * © 2009-2026 Adobe Systems Incorporated. All Rights Reserved.\n */\n/*{\"last_published\":\"2026-06-11 12:33:22 UTC\"}*/\n\n/**/\n\n\n@font-face {\nfont-family:\"nunito\";\nsrc:url(\"2952fa60-b835-44fc-93f7-3471c5d49075\") format(\" n\n  /* ---- Plum tints & shades (derived) ------------------------ */\n  --ep-plum-700:    #463a52;\n  --ep-plum-600:    #5b4a6a;\n  --ep-plum-400:    #82749140;  /* note: use tint tokens below for fills */\n  --ep-plum-tint:   #e7e3ec;   /* 12% plum on paper             */\n  --ep-plum-tint-2: #d2cbdb;\n\n  /* ---- Pine tints & shades (derived) ------------------------ */\n  --ep-pine-700:    #3a6056;\n  --ep-pine-600:    #4b7a6e;\n  --ep-pine-tint:   #dde9e5;   /* soft pine wash                */\n  --ep-pine-tint-2: #c3d6d0;\n\n  /* ---- Neutral scale (warm grey, off the ink/paper axis) ---- */\n  --ep-neutral-0:   #ffffff;\n  --ep-neutral-50:  #f7f7f4;\n  --ep-neutral-100: #f3f3f0;   /* = paper */\n  --ep-neutral-200: #e6e6e1;\n  --ep-neutral-300: #d4d4cd;\n  --ep-neutral-400: #aeaea6;\n  --ep-neutral-500: #84847c;\n  --ep-neutral-600: #5f5f59;\n  --ep-neutral-700: #444440;\n  --ep-neutral-800: #333330;\n  --ep-neutral-900: #2e2e2e;   /* = ink */\n\n  /* ---- Semantic aliases ------------------------------------- */\n  --surface-page:      var(--ep-paper);\n  --surface-raised:    var(--ep-neutral-0);\n  --surface-sunken:    var(--ep-neutral-50);\n  --surface-inverse:   var(--ep-ink);\n  --surface-brand:     var(--ep-plum);\n  --surface-brand-alt: var(--ep-pine);\n\n  --text-strong:    var(--ep-ink);\n  --text-body:      var(--ep-neutral-700);\n  --text-muted:     var(--ep-neutral-500);\n  --text-on-brand:  var(--ep-paper);\n  --text-on-dark:   var(--ep-paper);\n  --text-link:      var(--ep-pine-700);\n\n  --border-subtle:  var(--ep-neutral-200);\n  --border-default: var(--ep-neutral-300);\n  --border-strong:  var(--ep-neutral-400);\n  --border-brand:   var(--ep-plum);\n\n  --accent:         var(--ep-pine);\n  --accent-strong:  var(--ep-plum);\n\n  --status-danger:  var(--ep-clay);\n  --status-warning: var(--ep-ember);\n  --status-caution: var(--ep-sand);\n  --status-success: var(--ep-sage);\n\n  --focus-ring:     var(--ep-pine);\n}\n\n/* ============================================================\n   Expedition Psychology — Typography tokens\n   Headings: Arboria Medium  (substituted → Poppins)\n   Body:     Nunito Light\n   Brand heading:body size ratio guide ≈ 22 : 12\n   ============================================================ */\n\n:root {\n  /* ---- Families -------------------------------------------- */\n  --font-heading: 'arboria', 'Segoe UI', system-ui, sans-serif;\n  --font-body:    'Nunito', 'Segoe UI', system-ui, sans-serif;\n  --font-mono:    'Nunito', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* ---- Weights ---------------------------------------------- */\n  /* Body leans LIGHT per brand (Nunito Light = 300).            */\n  --weight-body:      300;\n  --weight-body-md:   400;\n  --weight-body-bold: 600;\n  /* Headings use Arboria Medium (the kit ships weight 500 only). */\n  --weight-heading:   500;\n  --weight-heading-md:500;\n\n  /* ---- Type scale (1.25 major-third-ish, tuned) ------------- */\n  --text-2xs:  0.75rem;   /* 12px — captions, legal           */\n  --text-xs:   0.8125rem; /* 13px                              */\n  --text-sm:   0.9375rem; /* 15px — small body                */\n  --text-base: 1.0625rem; /* 17px — default body              */\n  --text-lg:   1.25rem;   /* 20px — lead / large body         */\n  --text-xl:   1.5rem;    /* 24px — h4 / card title           */\n  --text-2xl:  1.9375rem; /* 31px — h3                        */\n  --text-3xl:  2.5rem;    /* 40px — h2                        */\n  --text-4xl:  3.25rem;   /* 52px — h1                        */\n  --text-5xl:  4.25rem;   /* 68px — display                   */\n  --text-6xl:  5.5rem;    /* 88px — hero display              */\n\n  /* ---- Line heights ---------------------------------------- */\n  --leading-tight:   1.08;\n  --leading-snug:    1.22;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.65;\n\n  /* ---- Letter spacing -------------------------------------- */\n  --tracking-tight:  -0.02em;\n  --tracking-snug:   -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.04em;\n  --tracking-caps:   0.14em;   /* eyebrows / overline labels   */\n\n  /* ---- Semantic roles -------------------------------------- */\n  --display-font:    var(--font-heading);\n  --display-weight:  var(--weight-heading);\n  --heading-font:    var(--font-heading);\n  --body-font:       var(--font-body);\n  --body-weight:     var(--weight-body);\n  --eyebrow-tracking:var(--tracking-caps);\n}\n\n/* ============================================================\n   Expedition Psychology — Spacing, radius, shadow, layout\n   8px base grid. Calm, generous, premium spacing.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (8px base) ----------------------------- */\n  --space-0:   0;\n  --space-1:   0.25rem;   /* 4  */\n  --space-2:   0.5rem;    /* 8  */\n  --space-3:   0.75rem;   /* 12 */\n  --space-4:   1rem;      /* 16 */\n  --space-5:   1.5rem;    /* 24 */\n  --space-6:   2rem;      /* 32 */\n  --space-7:   2.5rem;    /* 40 */\n  --space-8:   3rem;      /* 48 */\n  --space-9:   4rem;      /* 64 */\n  --space-10:  5rem;      /* 80 */\n  --space-11:  6.5rem;    /* 104 */\n  --space-12:  8rem;      /* 128 */\n\n  /* ---- Radius ---------------------------------------------- */\n  /* Understated, modern — gentle radii, never pill-soft on cards */\n  --radius-xs:   4px;\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-pill: 999px;\n\n  /* ---- Borders --------------------------------------------- */\n  --border-width:   1px;\n  --border-width-2: 2px;\n\n  /* ---- Shadows (soft, low, never harsh) -------------------- */\n  --shadow-xs:  0 1px 2px rgba(46, 46, 46, 0.06);\n  --shadow-sm:  0 1px 3px rgba(46, 46, 46, 0.08), 0 1px 2px rgba(46, 46, 46, 0.04);\n  --shadow-md:  0 4px 12px rgba(46, 46, 46, 0.08), 0 2px 4px rgba(46, 46, 46, 0.05);\n  --shadow-lg:  0 12px 32px rgba(46, 46, 46, 0.10), 0 4px 8px rgba(46, 46, 46, 0.05);\n  --shadow-xl:  0 24px 56px rgba(46, 46, 46, 0.14);\n  --shadow-focus: 0 0 0 3px rgba(75, 122, 110, 0.35);  /* pine focus */\n\n  /* ---- Motion ---------------------------------------------- */\n  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);  /* @kind other */\n  --ease-in-out:cubic-bezier(0.65, 0, 0.35, 1);  /* @kind other */\n  --dur-fast:   140ms;  /* @kind other */\n  --dur-base:   220ms;  /* @kind other */\n  --dur-slow:   400ms;  /* @kind other */\n\n  /* ---- Layout ---------------------------------------------- */\n  --container-sm:  640px;\n  --container-md:  860px;\n  --container-lg:  1120px;\n  --container-xl:  1320px;\n  --gutter:        var(--space-5);\n  --section-y:     var(--space-11);\n}\n\n/* ============================================================\n   Expedition Psychology — Base element defaults\n   Opinionated, minimal reset + brand typographic defaults.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-weight: var(--weight-body);\n  font-size: var(--text-base);\n  line-height: var(--leading-relaxed);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading);\n  font-weight: var(--weight-heading);\n  color: var(--text-strong);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  margin: 0 0 var(--space-4);\n  text-wrap: balance;\n}\n\nh1 { font-size: var(--text-4xl); }\nh2 { font-size: var(--text-3xl); }\nh3 { font-size: var(--text-2xl); letter-spacing: var(--tracking-snug); }\nh4 { font-size: var(--text-xl); letter-spacing: var(--tracking-snug); }\nh5 { font-size: var(--text-lg); letter-spacing: var(--tracking-normal); }\nh6 {\n  font-size: var(--text-2xs);\n  font-weight: var(--weight-heading);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--text-muted);\n  line-height: var(--leading-snug);\n}\n\np { margin: 0 0 var(--space-4); text-wrap: pretty; }\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; text-underline-offset: 2px; }\n\nstrong, b { font-weight: var(--weight-body-bold); color: var(--text-strong); }\n\nsmall { font-size: var(--text-2xs); }\n\nhr {\n  border: 0;\n  border-top: var(--border-width) solid var(--border-subtle);\n  margin: var(--space-6) 0;\n}\n\n::selection { background: var(--ep-pine-tint-2); color: var(--text-strong); }\n\n/* Eyebrow / overline label utility */\n.ep-eyebrow {\n  font-family: var(--font-heading);\n  font-weight: var(--weight-heading-md);\n  font-size: var(--text-2xs);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--accent);\n}\n\n<\u002Fstyle>\n  <script src=\"2b483316-a75a-4737-b8d8-e83ca47d5e50\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"background:var(--ep-paper); min-height:100vh; font-family:var(--font-body); font-weight:var(--weight-body); color:var(--text-body); padding-bottom:96px;\">\n\n  <!-- Sticky progress bar -->\n  <div style=\"position:sticky; top:0; z-index:20; background:rgba(243,243,240,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--border-subtle); padding:14px 24px;\">\n    <div style=\"max-width:720px; margin:0 auto; display:flex; align-items:center; gap:16px;\">\n      <div style=\"flex:1; height:6px; border-radius:var(--radius-pill); background:var(--ep-neutral-200); overflow:hidden;\">\n        <div style=\"height:100%; border-radius:var(--radius-pill); background:var(--ep-pine); transition:width 220ms var(--ease-out, ease-out); width:{{ progressPct }}%;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--font-heading); font-weight:var(--weight-heading); font-size:var(--text-sm); color:var(--text-strong); white-space:nowrap;\">{{ answeredCount }} / 20<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:720px; margin:0 auto; padding:56px 24px 0;\">\n\n    <x-import component-from-global-scope=\"ExpeditionPsychologyDesignSystem_4e7d0e.Eyebrow\" hint-size=\"auto,24px\">Performance Psychology<\u002Fx-import>\n\n    <h1 style=\"font-family:var(--font-heading); font-weight:var(--weight-heading); font-size:var(--text-4xl); line-height:var(--leading-tight); color:var(--text-strong); margin:14px 0 8px; letter-spacing:var(--tracking-tight);\">Performance Anxiety Test<\u002Fh1>\n\n    <div style=\"display:flex; gap:10px; margin-bottom:24px;\">\n      <x-import component-from-global-scope=\"ExpeditionPsychologyDesignSystem_4e7d0e.Badge\" hint-size=\"auto,28px\">20 Questions<\u002Fx-import>\n      <x-import component-from-global-scope=\"ExpeditionPsychologyDesignSystem_4e7d0e.Badge\" hint-size=\"auto,28px\">3 Minutes<\u002Fx-import>\n    <\u002Fdiv>\n\n    <p style=\"font-size:var(--text-lg); line-height:var(--leading-relaxed); color:var(--text-strong); font-weight:var(--weight-body-md); margin:0 0 16px;\">Do you struggle with stage fright?<\u002Fp>\n\n    <p style=\"font-size:var(--text-base); line-height:var(--leading-relaxed); color:var(--text-body); margin:0 0 16px;\">Performing can be nerve-wracking, whether you're a musician, athlete, speaker, or corporate professional. It's a common experience, but for some people, it can verge into severe anxiety. Take this test to see where you fall on the spectrum.<\u002Fp>\n\n    <p style=\"font-size:var(--text-base); line-height:var(--leading-relaxed); color:var(--text-muted); margin:0 0 32px;\">Using the key below, answer each question based on how strongly you agree or disagree with the statement.<\u002Fp>\n\n    <!-- Key legend -->\n    <div style=\"display:flex; justify-content:space-between; padding:0 4px; margin-bottom:40px; font-family:var(--font-heading); font-weight:var(--weight-heading); font-size:var(--text-xs); letter-spacing:var(--tracking-wide); color:var(--text-muted); text-transform:uppercase;\">\n      <span>Disagree<\u002Fspan>\n      <span>Neutral<\u002Fspan>\n      <span>Agree<\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- Questions -->\n    <sc-for list=\"{{ questions }}\" as=\"q\" hint-placeholder-count=\"20\">\n      <div style=\"background:var(--surface-raised); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:28px; margin-bottom:16px;\" data-answered=\"{{ q.answered }}\">\n        <p style=\"font-family:var(--font-heading); font-weight:var(--weight-heading); font-size:var(--text-lg); color:var(--text-strong); line-height:var(--leading-snug); margin:0 0 22px;\">{{ q.num }}. {{ q.text }}<\u002Fp>\n\n        <div style=\"display:flex; align-items:center; gap:6px;\">\n          <sc-for list=\"{{ q.options }}\" as=\"opt\" hint-placeholder-count=\"5\">\n            <button type=\"button\" onclick=\"{{ opt.select }}\" style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:none; padding:6px 2px; cursor:pointer;\" style-hover=\"opacity:0.85;\">\n              <div style=\"width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-heading); font-weight:var(--weight-heading); font-size:var(--text-sm); border:2px solid {{ opt.borderColor }}; background:{{ opt.bgColor }}; color:{{ opt.textColor }}; transition:all 180ms var(--ease-out, ease-out);\">{{ opt.value }}<\u002Fdiv>\n              <span style=\"font-size:var(--text-2xs); color:var(--text-muted); text-align:center; min-height:14px;\">{{ opt.caption }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <!-- Submit -->\n    <div style=\"display:flex; flex-direction:column; align-items:center; gap:14px; margin:40px 0 8px;\">\n      <sc-if value=\"{{ showIncompleteMessage }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"font-size:var(--text-sm); color:var(--ep-clay); font-weight:var(--weight-body-md); margin:0;\">Please answer all 20 questions to see your result.<\u002Fp>\n      <\u002Fsc-if>\n      <div style=\"width:220px;\" onclick=\"{{ handleSubmit }}\">\n        <x-import component-from-global-scope=\"ExpeditionPsychologyDesignSystem_4e7d0e.Button\" variant=\"primary\" hint-size=\"220px,48px\">See My Result<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Results -->\n    <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n      <div id=\"results\" style=\"margin-top:56px; padding:40px; border-radius:var(--radius-lg); background:var(--surface-raised); border:1px solid var(--border-subtle); box-shadow:var(--shadow-md);\">\n        <div style=\"font-family:var(--font-heading); font-weight:var(--weight-heading); font-size:var(--text-xs); letter-spacing:var(--tracking-caps); text-transform:uppercase; color:var(--text-muted); margin-bottom:10px;\">Your Result<\u002Fdiv>\n\n        <div style=\"display:flex; align-items:baseline; gap:14px; margin-bottom:6px; flex-wrap:wrap;\">\n          <div style=\"font-family:var(--font-heading); font-weight:var(--weight-heading); font-size:var(--text-3xl); color:var(--text-strong); white-space:nowrap;\">{{ score }} / 80<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading); font-weight:var(--weight-heading); font-size:var(--text-xl); color:{{ tier.color }}; white-space:nowrap;\">{{ tier.name }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Gauge -->\n        <div style=\"display:flex; gap:6px; margin:24px 0;\">\n          <sc-for list=\"{{ gaugeSegments }}\" as=\"seg\" hint-placeholder-count=\"4\">\n            <div style=\"flex:1; height:10px; border-radius:var(--radius-pill); background:{{ seg.color }}; opacity:{{ seg.opacity }};\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <p style=\"font-size:var(--text-base); line-height:var(--leading-relaxed); color:var(--text-body); margin:0;\">{{ tier.description }}<\u002Fp>\n\n        <sc-if value=\"{{ showCitations }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"font-size:var(--text-2xs); color:var(--text-muted); line-height:var(--leading-normal); margin:28px 0 0; padding-top:20px; border-top:1px solid var(--border-subtle);\">This assessment is adapted from Martens' Sport Competition Anxiety Test (SCAT), Mazzarolo &amp; Schubert's Music Performance Anxiety Scale (M-MPAS), and Smith et al.'s Sport Anxiety Scale-2 (SAS-2). It is intended for personal reflection only and is not a clinical diagnostic tool.<\u002Fp>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top:24px;\">\n          <a href=\"#\" onclick=\"{{ resetTest }}\" style=\"font-size:var(--text-sm); color:var(--text-link); font-weight:var(--weight-body-md); text-decoration:underline;\">Retake the test<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;requireAllAnswered&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;}, &quot;showCitations&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    answers: new Array(20).fill(null),\n    submitted: false,\n    showIncompleteMessage: false\n  };\n\n  getQuestionText() {\n    return [\n      \"I feel very nervous before I perform.\",\n      \"I avoid performing because of my anxiety.\",\n      \"Before I compete, I get a queasy feeling in my stomach.\",\n      \"I'm concerned that I may not do as well in competition as I could.\",\n      \"Before I compete, I feel calm.\",\n      \"My heart races before a competition.\",\n      \"I'm worried that others will be disappointed in my performance.\",\n      \"I frequently experience anxiety before I perform.\",\n      \"When I compete, I worry about making mistakes.\",\n      \"I get nervous before starting a sports competition, music performance, or work presentation.\",\n      \"Competing against others is enjoyable for me.\",\n      \"My concentration lapses during performances because of nervousness.\",\n      \"My body feels tense when I have to perform.\",\n      \"I doubt my abilities during performances.\",\n      \"Before I compete, I worry about not performing well.\",\n      \"I'm concerned about choking under pressure.\",\n      \"I don't perform because of my nerves.\",\n      \"Before I compete, I usually get uptight.\",\n      \"I'm confident in my ability to meet my goals, even if it involves performing under pressure.\",\n      \"I find myself trembling before or during a competitive event.\"\n    ];\n  }\n\n  isReverseIndex(i) {\n    return i === 4 || i === 10 || i === 18;\n  }\n\n  getTiers() {\n    return [\n      {\n        max: 20,\n        name: \"Steady Under Pressure\",\n        color: \"var(--ep-sage)\",\n        description: \"Performance situations don't tend to unsettle you. You feel prepared and composed when it matters. This is a solid baseline — if you'd like to sharpen your focus even further, we're glad to help.\"\n      },\n      {\n        max: 40,\n        name: \"Manageable Nerves\",\n        color: \"var(--ep-sand)\",\n        description: \"Some pre-performance nerves show up, but they're not holding you back. This is a common, workable pattern — a few practical tools could help you feel even steadier walking in.\"\n      },\n      {\n        max: 60,\n        name: \"Noticeable Tension\",\n        color: \"var(--ep-ember)\",\n        description: \"Anxiety is a regular companion before you perform, and it's likely shaping how you feel and sometimes how you do. You're not alone in this — it's a pattern we work with often, and it responds well to the right support.\"\n      },\n      {\n        max: 80,\n        name: \"High Intensity\",\n        color: \"var(--ep-clay)\",\n        description: \"Performance anxiety is showing up strongly and often, and it may be limiting what you do or how you feel doing it. This is more common than people think, and support genuinely helps — we'd encourage you to reach out and talk it through.\"\n      }\n    ];\n  }\n\n  setAnswer(index, value) {\n    const answers = this.state.answers.slice();\n    answers[index] = value;\n    this.setState({ answers, showIncompleteMessage: false });\n  }\n\n  handleSubmit() {\n    const requireAll = this.props.requireAllAnswered ?? true;\n    const allAnswered = this.state.answers.every(a => a !== null);\n    if (requireAll && !allAnswered) {\n      this.setState({ showIncompleteMessage: true });\n      return;\n    }\n    this.setState({ submitted: true, showIncompleteMessage: false });\n  }\n\n  resetTest(e) {\n    if (e && e.preventDefault) e.preventDefault();\n    this.setState({ answers: new Array(20).fill(null), submitted: false, showIncompleteMessage: false });\n  }\n\n  computeScore() {\n    return this.state.answers.reduce((sum, val, i) => {\n      if (val === null) return sum;\n      const scored = this.isReverseIndex(i) ? (4 - val) : val;\n      return sum + scored;\n    }, 0);\n  }\n\n  getTier(score) {\n    const tiers = this.getTiers();\n    return tiers.find(t => score <= t.max) || tiers[tiers.length - 1];\n  }\n\n  renderVals() {\n    const answers = this.state.answers;\n    const answeredCount = answers.filter(a => a !== null).length;\n    const progressPct = Math.round((answeredCount / 20) * 100);\n\n    const captionFor = (v) => v === 0 ? \"Strongly Disagree\" : (v === 4 ? \"Strongly Agree\" : \"\");\n\n    const questionText = this.getQuestionText();\n    const questions = questionText.map((text, i) => {\n      const current = answers[i];\n      return {\n        num: i + 1,\n        text,\n        answered: current !== null,\n        options: [0, 1, 2, 3, 4].map(v => {\n          const selected = current === v;\n          return {\n            value: v,\n            caption: captionFor(v),\n            select: () => this.setAnswer(i, v),\n            borderColor: selected ? \"var(--ep-pine)\" : \"var(--border-default)\",\n            bgColor: selected ? \"var(--ep-pine)\" : \"transparent\",\n            textColor: selected ? \"var(--text-on-brand)\" : \"var(--text-muted)\"\n          };\n        })\n      };\n    });\n\n    const score = this.computeScore();\n    const tiers = this.getTiers();\n    const tier = this.getTier(score);\n    const tierIndex = tiers.indexOf(tier);\n\n    const gaugeSegments = tiers.map((t, i) => ({\n      color: t.color,\n      opacity: i <= tierIndex ? 1 : 0.22\n    }));\n\n    return {\n      questions,\n      answeredCount,\n      progressPct,\n      showIncompleteMessage: this.state.showIncompleteMessage,\n      submitted: this.state.submitted,\n      score,\n      tier,\n      gaugeSegments,\n      showCitations: this.props.showCitations ?? true,\n      handleSubmit: () => this.handleSubmit(),\n      resetTest: (e) => this.resetTest(e)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

# Static site — no build step. This file exists so Netlify picks up the
# serverless function in netlify/functions (the Fear of Falling talk signup).
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The generic mountain-rescue URL was Buxton's before a second team was added.
[[redirects]]
  from = "/mountain-rescue-case-study"
  to = "/buxton-mountain-rescue-case-study"
  status = 301
  force = true

[[redirects]]
  from = "/mountain-rescue-case-study.html"
  to = "/buxton-mountain-rescue-case-study"
  status = 301
  force = true
